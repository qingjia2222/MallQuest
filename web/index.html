<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QD square AI 助手</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><span class="eyebrow">QD SQUARE · PRIVATE AI</span><h1>商场私域服务助手</h1><p id="connection">等待连接后端</p></div><div class="badge">DEMO MAP</div></header><section id="login" class="card login"><h2>Web 登录</h2><input id="username" value="demo" placeholder="账号"><input id="password" value="demo123" type="password" placeholder="密码"><button id="loginBtn">登录并连接 QD square</button><small>演示账号与微信 mock 登录映射到同一 user_id。</small></section><section id="workspace" hidden><nav><button data-query="停车场还有空位吗？">停车</button><button data-query="积分多久过期？">积分规则</button><button data-query="今天有什么特惠？">今日特惠</button><button id="reservationsBtn">我的预约</button></nav><div class="grid"><section class="card conversation"><h2>对话与规划</h2><div id="messages"></div><div class="composer"><textarea id="message">今晚7点两个人约会，人均250，想吃川菜，还想看电影。</textarea><button id="sendBtn">发送</button></div><button id="confirmBtn" class="accent" hidden>确认方案并执行事务</button><button id="speakBtn" hidden>播报结果</button></section><section class="card map"><h2>两层仿真路线</h2><div class="floor-tabs"><button data-floor="1">1F</button><button data-floor="2">2F</button></div><div class="map-wrap"><img id="mapImage" alt="QD square Demo map"><svg id="routeSvg" viewBox="0 0 1000 760"></svg></div><p id="routeMeta">规划后显示 Dijkstra 路线</p></section></div><section class="card"><h2>结构化结果</h2><pre id="result">等待查询</pre></section></section></main><script type="module" src="app.js"></script></body></html>
